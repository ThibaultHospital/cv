
name: Alerte nouveau visiteur CV

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alerte-visiteur-cv
  cancel-in-progress: false

jobs:
  surveillance:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Surveiller les visites Umami
        env:
          UMAMI_URL: ${{ secrets.UMAMI_URL }}
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python agents/visiteurs_cv.py

      - name: Enregistrer l'historique anti-doublons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/.visiteurs_cv_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour historique des visites CV"
            git push
          else
            echo "Aucune modification de l'historique."
          fi
